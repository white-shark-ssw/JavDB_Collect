name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish run locator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=JavDBCollect-IPA \
            -f description="run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare app icon
        run: |
          set -euo pipefail
          ICON_DIR="JavDBCollect/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cat JavDBCollect/Resources/AppIcon.b64.00 \
              JavDBCollect/Resources/AppIcon.b64.01 \
              JavDBCollect/Resources/AppIcon.b64.02 \
              JavDBCollect/Resources/AppIcon.b64.03 \
              JavDBCollect/Resources/AppIcon.b64.04 | base64 --decode > "$ICON_DIR/AppIcon-source.png"
          echo "6ae2c6cd817bfbc8ba8e4474ef711b199d0b8b83c42f6a530dff967f15205a24  $ICON_DIR/AppIcon-source.png" | shasum -a 256 -c -
          sips -z 1024 1024 "$ICON_DIR/AppIcon-source.png" --out "$ICON_DIR/AppIcon-1024.png" >/dev/null
          rm "$ICON_DIR/AppIcon-source.png"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON
          sips -g pixelWidth -g pixelHeight "$ICON_DIR/AppIcon-1024.png"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project JavDBCollect.xcodeproj \
            -scheme JavDBCollect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/JavDBCollect.app"
          test -d "$APP_PATH"
          rm -rf Payload JavDBCollect.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry JavDBCollect.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavDBCollect-IPA
          path: JavDBCollect.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context=JavDBCollect-IPA \
            -f description="run ${GITHUB_RUN_ID}: ${JOB_STATUS}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
