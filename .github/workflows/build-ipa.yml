name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project JavDBCollect.xcodeproj \
            -scheme JavDBCollect \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/JavDBCollect.app"
          test -d "$APP_PATH"
          rm -rf Payload JavDBCollect.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry JavDBCollect.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavDBCollect-IPA
          path: JavDBCollect.ipa
          if-no-files-found: error
