name: JavDBCollect
options:
  bundleIdPrefix: com.whiteshark
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  JavDBCollect:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: JavDBCollect
        excludes:
          - Resources
    resources:
      - path: JavDBCollect/Resources
    dependencies:
      - sdk: WebKit.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whiteshark.javdbcollect
        PRODUCT_NAME: JavDBCollect
        INFOPLIST_FILE: JavDBCollect/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
